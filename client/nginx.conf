# Giao diện (Phase 7, D33): phục vụ bản build và chuyển /api sang máy chủ Node.
server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;

  # Ảnh đơn thuốc, ảnh sản phẩm, tệp Excel nhập tối đa 5 MB.
  client_max_body_size 12m;

  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;

  location /api/ {
    proxy_pass http://server:3000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    # Trợ lý AI trả tiến trình dạng SSE: không gom bộ đệm, chờ đủ lâu.
    proxy_buffering off;
    proxy_read_timeout 180s;
  }

  # Tệp có mã băm trong tên: lưu lâu ở trình duyệt.
  location /assets/ {
    try_files $uri =404;
    add_header Cache-Control "public, max-age=31536000, immutable";
  }

  # Ứng dụng một trang: mọi đường dẫn khác trả index.html (không lưu đệm).
  location / {
    try_files $uri /index.html;
    add_header Cache-Control "no-cache";
  }
}
