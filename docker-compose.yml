services:
  db:
    image: postgres:17
    container_name: gpp-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: gpp
      POSTGRES_PASSWORD: gpp_dev_password
      POSTGRES_DB: pharmacy_gpp
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gpp -d pharmacy_gpp"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
